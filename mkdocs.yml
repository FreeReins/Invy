# The documentation site, built from docs/ with MkDocs Material. Published to GitHub Pages by
# .github/workflows/docs.yml and built into the container image at /help (Dockerfile, docs stage).
# Build locally: pip install -r docs/requirements.txt && mkdocs serve
site_name: Invy
site_description: >-
  Invy is a free, self-hosted home inventory: everything you own, where it is, found in a moment. Install, run and
  troubleshoot it.
# The in-app copy (Dockerfile) builds with SITE_URL empty, so every address in it stays relative to /help.
site_url: !ENV [SITE_URL, 'https://freereins.github.io/invy/']
repo_url: https://github.com/FreeReins/invy
repo_name: invy
edit_uri: edit/main/docs/
copyright: Invy is free software under the GNU GPL v3.0

docs_dir: docs
# The offline zip attached to each release builds with USE_DIRECTORY_URLS=false, so pages open from a folder.
use_directory_urls: !ENV [USE_DIRECTORY_URLS, true]
# Notes for whoever edits the docs, and the build's own inputs: not pages.
exclude_docs: |
  AGENTS.md
  requirements.txt
  roadmap/

theme:
  name: material
  language: en
  # No Google Fonts: the site must work with no internet when served by Invy at /help.
  font: false
  icon:
    logo: material/package-variant-closed
    repo: fontawesome/brands/github
  favicon: images/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  # Downloads outside assets at build time, Mermaid included, and adds it to each page by a relative path, so the
  # built site makes no outside requests, also under /help.
  - privacy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - github-callouts
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - What Invy does: getting-started/what-is-invy.md
      - What you need: getting-started/requirements.md
      - Install with Podman: getting-started/install-podman.md
      - Install with Docker: getting-started/install-docker-compose.md
      - Install on Windows: getting-started/install-windows.md
      - Other platforms: getting-started/install-other-platforms.md
      - First run: getting-started/first-run.md
  - Using Invy:
      - Spaces, people and roles: using/spaces.md
      - Types and fields: using/types-and-fields.md
      - Items, containers and moves: using/items.md
      - Labels and scanning: using/labels-and-scanning.md
      - Last seen and audits: using/audits.md
      - Timeline and activity: using/timeline.md
      - Search: using/search.md
  - Running it:
      - People and accounts: admin/people-and-accounts.md
      - HTTPS and certificates: admin/https-and-certificates.md
      - Your own certificate: admin/own-certificate.md
      - Behind a reverse proxy: admin/reverse-proxy.md
      - Reach it over Tailscale: admin/tailscale.md
      - Settings reference: admin/settings.md
      - Notifications: admin/notifications.md
      - AI assistants: admin/ai-assistants.md
      - Backups and restore: admin/backups-and-restore.md
      - Upgrading: admin/upgrading.md
      - Monitoring and logs: admin/monitoring-and-logs.md
      - Uninstall: admin/uninstall.md
  - Troubleshooting:
      - troubleshooting/index.md
      - Install and startup: troubleshooting/install-and-startup.md
      - Signing in: troubleshooting/signing-in.md
      - HTTPS and certificates: troubleshooting/https-and-certificates.md
      - Notifications and integrations: troubleshooting/notifications-and-integrations.md
      - Backups: troubleshooting/backups.md
  - Developers:
      - The design: developers/design.md
      - HTTP API: reference/api.md
